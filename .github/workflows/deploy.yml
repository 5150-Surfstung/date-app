name: Test and deploy

on:
  push:
    branches: [claude/date-app-setup-1fAZW, main]
  workflow_dispatch:

env:
  STATIC_EXPORT: '1'
  NEXT_PUBLIC_STATIC_EXPORT: '1'
  NEXT_PUBLIC_SITE_URL: https://5150-surfstung.github.io/date-app
  NEXT_PUBLIC_BASE_PATH: /date-app
  NEXT_PUBLIC_SUPABASE_URL: https://iwotispqqcnkrbcnvozq.supabase.co
  # Anon key is public by design; RLS makes it write-only.
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml3b3Rpc3BxcWNua3JiY252b3pxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5ODk5MTQsImV4cCI6MjA5NzU2NTkxNH0.cnvrHhZkrygCNuxMQitqsS9TBqC_1Uy0h6ymh9jmppY

jobs:
  photos:
    # Pulls full-size demo photos from Canva's media host, which the dev
    # sandbox can't reach. Skips files that are already full size.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Fetch
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          m = json.load(open('public/demo-manifest.json'))
          base = "https://media.canva.com/v2/image-resize/format:JPG/height:{h}/quality:{q}/uri:ifs%3A%2F%2FM%2F{uri}/watermark:F/width:{w}?{sig}"
          for handle, v in m.items():
              out = f"public/demo/{handle}.jpg"
              if os.path.exists(out) and os.path.getsize(out) > 60000:
                  print(handle, "already full size"); continue
              variants = [
                  base.format(h=1408, q=92, w=1136, uri=v["uri"], sig=v["sig"]) + "&signer=media-rpc",
                  base.format(h=1408, q=92, w=1136, uri=v["uri"], sig=v["sig"]) + "&signer=media-rpc&x-canva-quality=thumbnail",
                  base.format(h=200, q=75, w=161, uri=v["uri"], sig=v["sig"]) + "&signer=media-rpc&x-canva-quality=thumbnail",
              ]
              for url in variants:
                  r = subprocess.run(["curl", "-fsSL", "-o", out + ".tmp", url])
                  if r.returncode == 0 and os.path.getsize(out + ".tmp") > 0:
                      os.replace(out + ".tmp", out)
                      print(handle, subprocess.run(["file", out], capture_output=True, text=True).stdout.strip()[:120])
                      break
              else:
                  print(handle, "FAILED all variants")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/demo
          git diff --cached --quiet && echo "no changes" || (git commit -m "Demo photos at full resolution [skip ci]" && git push)

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: End-to-end Supabase intake test
        run: node scripts/e2e-supabase.mjs

  deploy:
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static site
        run: npm run build
        env:
          BASE_PATH: /date-app
      - name: Publish to gh-pages
        # Branch-based Pages: pushing gh-pages is the deployment.
        # (The workflow token can't create a Pages site via the API,
        # so actions/deploy-pages is not usable here.)
        run: |
          touch out/.nojekyll
          cd out
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
