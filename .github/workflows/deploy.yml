name: Test and deploy

on:
  push:
    branches: [claude/date-app-setup-1fAZW, main]
  workflow_dispatch:

env:
  STATIC_EXPORT: '1'
  NEXT_PUBLIC_STATIC_EXPORT: '1'
  NEXT_PUBLIC_SITE_URL: https://5150-surfstung.github.io/date-app
  NEXT_PUBLIC_BASE_PATH: /date-app
  NEXT_PUBLIC_SUPABASE_URL: https://bjnfxgdulhmqktqqezro.supabase.co
  # Anon key is public by design; RLS makes it write-only.
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJqbmZ4Z2R1bGhtcWt0cXFlenJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2Njk0MjcsImV4cCI6MjEwNjI0NTQyN30._rFzgf4phGkwDQF70JQil5BqPmfGuyDz9yBD6p3mN5g

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Val's ear (voice parser) test
        run: npx tsx tests/voice.test.ts
      - name: Val's guardrails test
        run: npx tsx tests/val-guard.test.ts
      - name: Everyone is equal (matching fairness) test
        run: npx tsx tests/match.test.ts
      - name: End-to-end Supabase intake test
        run: node scripts/e2e-supabase.mjs

  deploy:
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static site
        run: npm run build
        env:
          BASE_PATH: /date-app
      - name: Publish to gh-pages
        # Branch-based Pages: pushing gh-pages is the deployment.
        # (The workflow token can't create a Pages site via the API,
        # so actions/deploy-pages is not usable here.)
        run: |
          touch out/.nojekyll
          cd out
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
